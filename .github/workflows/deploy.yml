name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 页面手动触发一次
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署；排队中的推送不会打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 要求 Node >= 22.12，低于此版本会在构建阶段报引擎不匹配
          node-version: '22'
          cache: npm

      - name: Guard against stale runs
        # 重跑历史运行会把旧代码重新发布上线（例如把 URL 回滚成旧路由）。
        # 这里确认本次运行对应的提交就是 main 的最新提交，否则直接失败并提示。
        run: |
          git fetch --depth=1 origin main
          latest=$(git rev-parse origin/main)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::本次运行构建的是 $GITHUB_SHA，但 main 最新提交是 $latest。"
            echo "::error::为避免用旧代码覆盖线上站点，已阻止本次部署。"
            echo "::error::如需重新发布当前版本，请到 main 最新提交对应的那次运行点 Re-run。"
            exit 1
          fi
          echo "提交校验通过：$GITHUB_SHA 就是 main 最新提交"

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        # 注意：仓库必须先启用 Pages（Settings → Pages → Source 选 GitHub Actions），
        # 否则这一步会以 "Get Pages site failed" 失败；enablement: true 需要额外提供 PAT，
        # 默认的 GITHUB_TOKEN 不足以自动开启。
        uses: actions/configure-pages@v6

      - name: Build site and export WeChat pages
        # SITE_URL / BASE_PATH 由 configure-pages 注入，因此换仓库或换域名都不用改代码：
        #   SITE_URL  = https://<user>.github.io   （origin，不含子路径）
        #   BASE_PATH = /<repo> 或 ''（用户站点、自定义域名）
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Design and export gates
        # 设计规范自检（对比度 / 文案 / 结构 / base 一致性）与公众号导出回归测试
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run audit
          npm run test:wechat

      - name: Upload artifact
        # 只上传 dist；源码与 .dsh/ 不会进入 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
