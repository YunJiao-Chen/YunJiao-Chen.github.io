<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="yjchen&#39;s blog">
  <!-- 站点标志：咖啡杯。用文本而不是路径画，让浏览器用用户自己的彩色 emoji 字体渲染，
       既不会在仓库里再分发 emoji 字体数据，也能跟系统主题一致。 -->
  <text x="50" y="54" font-size="88" text-anchor="middle" dominant-baseline="central"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Twemoji Mozilla, sans-serif">☕️</text>
</svg>
